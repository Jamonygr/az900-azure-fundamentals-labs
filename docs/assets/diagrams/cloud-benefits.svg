<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
<title id="title">Let capacity follow demand</title><desc id="desc">A conceptual scale-out and scale-in example moves from one instance to two and back to one as demand changes. The cloud service must support and be configured for this behavior. Availability uses resilient design, while reliability also considers recovery and shared dependencies.</desc>
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EFF6FF"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0078D4"/><stop offset="1" stop-color="#6366F1"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#0078D4" stroke-width="2"/></marker></defs>
<g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="560" rx="0" fill="#F8FAFC" stroke="none" stroke-width="2"/><circle cx="940" cy="8" r="180" fill="#E0F2FE" stroke="none" stroke-width="2"/><circle cx="12" cy="548" r="130" fill="#EEF2FF" stroke="none" stroke-width="2"/><text x="36" y="53" font-size="32" fill="#0F172A" font-weight="700" text-anchor="start">Let capacity follow demand</text><text x="36" y="87" font-size="22" fill="#475569" font-weight="500" text-anchor="start">Scaling changes capacity; reliability also needs recovery and dependencies.</text><path d="M92 321C245 321 211 239 391 220S634 219 746 296S819 324 868 324" fill="none" stroke="#22D3EE" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(115.0 135) scale(0.73)"><path d="M0 25L42 0L84 25L42 50Z" fill="#DBEAFE" stroke="#0078D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 25L42 50V136L0 111Z" fill="#EFF6FF" stroke="#0078D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 50L84 25V111L42 136Z" fill="#BFDBFE" stroke="#0078D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 51L31 63M10 73L31 85M10 95L31 107" fill="none" stroke="#0078D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="70" r="3" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="60" cy="92" r="3" fill="#FFFFFF" stroke="none" stroke-width="2"/></g><text x="157" y="356" font-size="22" fill="#0F172A" font-weight="700" text-anchor="middle">Lower demand</text><text x="157" y="387" font-size="22" fill="#475569" font-weight="500" text-anchor="middle">1 instance</text><g transform="translate(386.0 135) scale(0.73)"><path d="M0 25L42 0L84 25L42 50Z" fill="#DBEAFE" stroke="#0078D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 25L42 50V136L0 111Z" fill="#EFF6FF" stroke="#0078D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 50L84 25V111L42 136Z" fill="#BFDBFE" stroke="#0078D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 51L31 63M10 73L31 85M10 95L31 107" fill="none" stroke="#0078D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="70" r="3" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="60" cy="92" r="3" fill="#FFFFFF" stroke="none" stroke-width="2"/></g><g transform="translate(472.0 135) scale(0.73)"><path d="M0 25L42 0L84 25L42 50Z" fill="#DBEAFE" stroke="#0078D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 25L42 50V136L0 111Z" fill="#EFF6FF" stroke="#0078D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 50L84 25V111L42 136Z" fill="#BFDBFE" stroke="#0078D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 51L31 63M10 73L31 85M10 95L31 107" fill="none" stroke="#0078D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="70" r="3" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="60" cy="92" r="3" fill="#FFFFFF" stroke="none" stroke-width="2"/></g><text x="471" y="356" font-size="22" fill="#0F172A" font-weight="700" text-anchor="middle">Higher demand</text><text x="471" y="387" font-size="22" fill="#475569" font-weight="500" text-anchor="middle">2 instances</text><g transform="translate(755.0 135) scale(0.73)"><path d="M0 25L42 0L84 25L42 50Z" fill="#DBEAFE" stroke="#0078D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 25L42 50V136L0 111Z" fill="#EFF6FF" stroke="#0078D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 50L84 25V111L42 136Z" fill="#BFDBFE" stroke="#0078D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 51L31 63M10 73L31 85M10 95L31 107" fill="none" stroke="#0078D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="70" r="3" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="60" cy="92" r="3" fill="#FFFFFF" stroke="none" stroke-width="2"/></g><text x="797" y="356" font-size="22" fill="#0F172A" font-weight="700" text-anchor="middle">Lower demand</text><text x="797" y="387" font-size="22" fill="#475569" font-weight="500" text-anchor="middle">1 instance</text><path d="M255,184 L362,184" stroke="#0078D4" fill="none" stroke-width="3" marker-end="url(#arrow)"/><path d="M579,184 L696,184" stroke="#0078D4" fill="none" stroke-width="3" marker-end="url(#arrow)"/><rect x="64" y="429" width="832" height="98" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><g transform="translate(87 447) scale(0.5163934426229508)" fill="none" stroke="#6366F1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M61 8L107 26V63C107 88 82 105 61 112C39 104 14 88 14 63V26Z"/><path d="M36 59L53 76L85 43"/></g><text x="168" y="467" font-size="22" fill="#0F172A" font-weight="500" text-anchor="start">Availability: design for failure</text><text x="168" y="496" font-size="22" fill="#0F172A" font-weight="500" text-anchor="start">Reliability: test recovery and dependencies</text></g></svg>