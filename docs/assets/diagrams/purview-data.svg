<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
<title id="title">Understand and govern the data estate</title><desc id="desc">Purview spans data governance, data security, and data compliance. Discover assets and lineage, configure protection and sharing controls, and manage applicable retention and evidence. Metadata access does not confer source-data access.</desc>
<defs><linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient><linearGradient id="cloud" x2="0.8" y2="1"><stop stop-color="#E0F2FE"/><stop offset="1" stop-color="#A5B4FC"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#0078D4"/></marker></defs>
<rect width="960" height="560" rx="28" fill="url(#canvas)"/><circle cx="910" cy="40" r="155" fill="#22D3EE" opacity="0.05"/><circle cx="20" cy="560" r="190" fill="#6366F1" opacity="0.04"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="52" font-size="30" fill="#0F172A" font-weight="700" text-anchor="start">Understand and govern the data estate</text><text x="40" y="88" font-size="22" fill="#475569" font-weight="400" text-anchor="start">Select a capability by the information need, not a score alone.</text><circle cx="170" cy="205" r="76" fill="#0078D4" opacity="0.08"/><g transform="translate(110 145) scale(1)" color="#0078D4"><rect x="9" y="19" width="102" height="88" rx="15" fill="currentColor"/><rect x="24" y="35" width="22" height="22" rx="4" fill="#FFFFFF"/><rect x="24" y="69" width="22" height="22" rx="4" fill="#FFFFFF"/><path d="M61 43H94M61 77H94M61 55H81M61 89H81" stroke="#FFFFFF" stroke-width="5"/></g><text x="170" y="313" font-size="29" fill="#0078D4" font-weight="700" text-anchor="middle">Discover</text><text x="170" y="352" font-size="22" fill="#0F172A" font-weight="400" text-anchor="middle">Metadata + lineage</text><text x="170" y="388" font-size="22" fill="#475569" font-weight="400" text-anchor="middle">Data Map / catalog</text><circle cx="480" cy="205" r="76" fill="#6366F1" opacity="0.08"/><g transform="translate(420 145) scale(1)" color="#6366F1"><path d="M60 8L108 26V60C108 91 79 111 60 118C41 111 12 91 12 60V26Z" fill="currentColor"/><path d="M35 61L52 78L86 43" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g><text x="480" y="313" font-size="29" fill="#6366F1" font-weight="700" text-anchor="middle">Protect</text><text x="480" y="352" font-size="22" fill="#0F172A" font-weight="400" text-anchor="middle">Labels + sharing rules</text><text x="480" y="388" font-size="22" fill="#475569" font-weight="400" text-anchor="middle">Information protection</text><circle cx="790" cy="205" r="76" fill="#0078D4" opacity="0.08"/><g transform="translate(730 145) scale(1)" color="#0078D4"><path d="M24 8H77L102 34V113H24Z" fill="currentColor"/><path d="M77 8V34H102M40 54H84M40 73H84M40 92H73" fill="none" stroke="#FFFFFF" stroke-width="6"/></g><text x="790" y="313" font-size="29" fill="#0078D4" font-weight="700" text-anchor="middle">Comply</text><text x="790" y="352" font-size="22" fill="#0F172A" font-weight="400" text-anchor="middle">Retention + evidence</text><text x="790" y="388" font-size="22" fill="#475569" font-weight="400" text-anchor="middle">eDiscovery / assessments</text><rect x="52" y="439" width="856" height="78" rx="24" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="480" y="474" font-size="25" fill="#0F172A" font-weight="700" text-anchor="middle">Catalog access ≠ source-data permission</text><text x="480" y="505" font-size="22" fill="#475569" font-weight="400" text-anchor="middle">Synthetic metadata only; no scan or policy is configured.</text></g></svg>