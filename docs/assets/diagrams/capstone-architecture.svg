<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="title desc">
<title id="title">A small, disposable Azure proof of concept</title><desc id="desc">The owned resource group contains a VNet with address space 10.90.0.0/16, an empty subnet 10.90.1.0/24, and a separate StorageV2 Standard_LRS account. The account has an authorized public service endpoint, HTTPS, and a private practice container. It is not placed in the VNet. No VM or private endpoint is created. Ownership tags and management Activity Log support validation and verified cleanup.</desc>
<defs><linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient><linearGradient id="cloud" x2="0.8" y2="1"><stop stop-color="#E0F2FE"/><stop offset="1" stop-color="#A5B4FC"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#0078D4"/></marker></defs>
<rect width="960" height="660" rx="28" fill="url(#canvas)"/><circle cx="910" cy="40" r="155" fill="#22D3EE" opacity="0.05"/><circle cx="20" cy="660" r="190" fill="#6366F1" opacity="0.04"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="52" font-size="30" fill="#0F172A" font-weight="700" text-anchor="start">A small, disposable Azure proof of concept</text><text x="40" y="88" font-size="22" fill="#475569" font-weight="400" text-anchor="start">Configured resources only; resource-group membership is not network connectivity.</text><rect x="37" y="126" width="886" height="454" rx="24" fill="#FFFFFF" stroke="#0078D4" stroke-width="2" /><text x="480" y="163" font-size="26" fill="#0078D4" font-weight="700" text-anchor="middle">Owned resource group • rg-az900-21-{RunId}</text><rect x="64" y="190" width="384" height="303" rx="24" fill="#EFF6FF" stroke="#0078D4" stroke-width="2" /><text x="255" y="228" font-size="25" fill="#0078D4" font-weight="700" text-anchor="middle">vnet-az900</text><text x="255" y="266" font-size="24" fill="#0F172A" font-weight="400" text-anchor="middle">10.90.0.0/16</text><rect x="93" y="287" width="326" height="178" rx="18" fill="#FFFFFF" stroke="#6366F1" stroke-width="2" stroke-dasharray="8 6"/><g transform="translate(112 309) scale(0.62)" color="#6366F1"><path d="M60 41V69M22 88V69H98V88" stroke="currentColor" stroke-width="6" fill="none"/><rect x="38" y="8" width="44" height="35" rx="8" fill="currentColor"/><rect x="1" y="84" width="44" height="35" rx="8" fill="currentColor"/><rect x="76" y="84" width="44" height="35" rx="8" fill="currentColor"/></g><text x="283" y="330" font-size="23" fill="#6366F1" font-weight="700" text-anchor="middle">subnet-default</text><text x="283" y="366" font-size="22" fill="#0F172A" font-weight="400" text-anchor="middle">10.90.1.0/24</text><text x="255" y="437" font-size="22" fill="#475569" font-weight="400" text-anchor="middle">Empty • future app network</text><circle cx="684" cy="281" r="67" fill="#0078D4" opacity="0.08"/><g transform="translate(636.0 233.0) scale(0.8)" color="#0078D4"><path d="M15 31V91C15 118 105 118 105 91V31Z" fill="currentColor"/><ellipse cx="60" cy="31" rx="45" ry="19" fill="#A5B4FC" stroke="currentColor" stroke-width="4"/><path d="M16 58C20 79 100 79 104 58M16 84C20 104 100 104 104 84" fill="none" stroke="#FFFFFF" stroke-width="5"/></g><text x="684" y="380" font-size="24" fill="#0078D4" font-weight="700" text-anchor="middle">StorageV2 • Standard_LRS</text><text x="684" y="418" font-size="23" fill="#0F172A" font-weight="400" text-anchor="middle">Public service endpoint</text><text x="684" y="453" font-size="22" fill="#475569" font-weight="400" text-anchor="middle">Authorized access • HTTPS</text><g transform="translate(488 472) scale(0.43)" color="#6366F1"><rect x="22" y="52" width="76" height="62" rx="13" fill="currentColor"/><path d="M36 54V35C36 1 84 1 84 35V54" fill="none" stroke="currentColor" stroke-width="13"/><circle cx="60" cy="78" r="7" fill="#FFFFFF"/><path d="M60 82V94" stroke="#FFFFFF" stroke-width="7"/></g><text x="684" y="502" font-size="23" fill="#6366F1" font-weight="700" text-anchor="middle">Private practice container</text><text x="480" y="549" font-size="22" fill="#475569" font-weight="400" text-anchor="middle">Ownership tags • management Activity Log • verified cleanup</text><text x="480" y="623" font-size="23" fill="#0F172A" font-weight="700" text-anchor="middle">Storage is outside the subnet. No VM or private endpoint is created.</text></g></svg>