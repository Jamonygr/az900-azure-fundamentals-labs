<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="title desc">
<title id="title">Protect with complementary layers</title><desc id="desc">Zero Trust verifies explicitly, limits privilege, and assumes breach. Defense in depth places physical, identity, network, host, application, and data controls together. Defender for Cloud supports posture assessment and workload protection; no paid plan is enabled in this lesson.</desc>
<defs><linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient><linearGradient id="cloud" x2="0.8" y2="1"><stop stop-color="#E0F2FE"/><stop offset="1" stop-color="#A5B4FC"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#0078D4"/></marker></defs>
<rect width="960" height="640" rx="28" fill="url(#canvas)"/><circle cx="910" cy="40" r="155" fill="#22D3EE" opacity="0.05"/><circle cx="20" cy="640" r="190" fill="#6366F1" opacity="0.04"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="52" font-size="30" fill="#0F172A" font-weight="700" text-anchor="start">Protect with complementary layers</text><text x="40" y="88" font-size="22" fill="#475569" font-weight="400" text-anchor="start">A single firewall or a favorable score cannot cover every risk.</text><rect x="46" y="112" width="272" height="48" rx="24" fill="#EDEFFE" stroke="none" stroke-width="2" /><text x="182" y="144" font-size="23" fill="#6366F1" font-weight="700" text-anchor="middle">Verify explicitly</text><rect x="344" y="112" width="272" height="48" rx="24" fill="#EDEFFE" stroke="none" stroke-width="2" /><text x="480" y="144" font-size="23" fill="#6366F1" font-weight="700" text-anchor="middle">Least privilege</text><rect x="641" y="112" width="272" height="48" rx="24" fill="#EDEFFE" stroke="none" stroke-width="2" /><text x="777" y="144" font-size="23" fill="#6366F1" font-weight="700" text-anchor="middle">Assume breach</text><circle cx="480" cy="365" r="176" fill="none" stroke="#0078D4" stroke-width="10" opacity=".22"/><circle cx="480" cy="365" r="138" fill="none" stroke="#6366F1" stroke-width="10" opacity=".22"/><circle cx="480" cy="365" r="98" fill="none" stroke="#22D3EE" stroke-width="10" opacity=".22"/><circle cx="480" cy="365" r="73" fill="#0078D4" opacity="0.08"/><g transform="translate(429.0 314.0) scale(0.85)" color="#0078D4"><path d="M15 31V91C15 118 105 118 105 91V31Z" fill="currentColor"/><ellipse cx="60" cy="31" rx="45" ry="19" fill="#A5B4FC" stroke="currentColor" stroke-width="4"/><path d="M16 58C20 79 100 79 104 58M16 84C20 104 100 104 104 84" fill="none" stroke="#FFFFFF" stroke-width="5"/></g><text x="480" y="467" font-size="23" fill="#0078D4" font-weight="700" text-anchor="middle">Data</text><circle cx="185" cy="257" r="57" fill="#0078D4" opacity="0.08"/><g transform="translate(146.0 218.0) scale(0.65)" color="#0078D4"><rect x="23" y="8" width="74" height="105" rx="14" fill="currentColor"/><path d="M34 37H86M34 62H86M34 87H86" stroke="#FFFFFF" stroke-width="6"/><circle cx="43" cy="23" r="4" fill="#FFFFFF"/><circle cx="43" cy="49" r="4" fill="#FFFFFF"/><circle cx="43" cy="75" r="4" fill="#FFFFFF"/></g><text x="185" y="347" font-size="23" fill="#0078D4" font-weight="700" text-anchor="middle">Physical facilities</text><path d="M260 257 L330 365" fill="none" stroke="#0078D4" stroke-width="3" stroke-linecap="round"  /><circle cx="185" cy="441" r="57" fill="#6366F1" opacity="0.08"/><g transform="translate(146.0 402.0) scale(0.65)" color="#6366F1"><circle cx="32" cy="40" r="25" fill="none" stroke="currentColor" stroke-width="13"/><path d="M49 59L100 110M78 88L94 72M92 102L106 88" stroke="currentColor" stroke-width="13" stroke-linejoin="round"/></g><text x="185" y="531" font-size="23" fill="#6366F1" font-weight="700" text-anchor="middle">Identity</text><path d="M260 441 L330 365" fill="none" stroke="#6366F1" stroke-width="3" stroke-linecap="round"  /><circle cx="775" cy="257" r="57" fill="#0078D4" opacity="0.08"/><g transform="translate(736.0 218.0) scale(0.65)" color="#0078D4"><path d="M60 41V69M22 88V69H98V88" stroke="currentColor" stroke-width="6" fill="none"/><rect x="38" y="8" width="44" height="35" rx="8" fill="currentColor"/><rect x="1" y="84" width="44" height="35" rx="8" fill="currentColor"/><rect x="76" y="84" width="44" height="35" rx="8" fill="currentColor"/></g><text x="775" y="347" font-size="23" fill="#0078D4" font-weight="700" text-anchor="middle">Network</text><path d="M700 257 L630 365" fill="none" stroke="#0078D4" stroke-width="3" stroke-linecap="round"  /><circle cx="775" cy="441" r="57" fill="#6366F1" opacity="0.08"/><g transform="translate(736.0 402.0) scale(0.65)" color="#6366F1"><rect x="4" y="12" width="112" height="99" rx="14" fill="currentColor"/><path d="M6 37H114" stroke="#FFFFFF" stroke-width="5"/><circle cx="18" cy="26" r="4" fill="#FFFFFF"/><circle cx="31" cy="26" r="4" fill="#FFFFFF"/><rect x="20" y="55" width="32" height="38" rx="5" fill="#FFFFFF"/><path d="M67 59H97M67 75H97M67 91H89" stroke="#FFFFFF" stroke-width="5"/></g><text x="775" y="531" font-size="23" fill="#6366F1" font-weight="700" text-anchor="middle">Host + application</text><path d="M700 441 L630 365" fill="none" stroke="#6366F1" stroke-width="3" stroke-linecap="round"  /><rect x="160" y="553" width="640" height="58" rx="24" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="480" y="590" font-size="22" fill="#0F172A" font-weight="700" text-anchor="middle">Defender for Cloud: assess posture + protect workloads</text></g></svg>