<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
<title id="title">From measured usage to a cost estimate</title><desc id="desc">Compute runtime, capacity, transactions, and transfer contribute usage meters to an estimate, calculated using applicable rates. Pay-as-you-go offers flexibility. Reservations and savings plans involve commitments for eligible usage. Spot compute may be evicted. Actual rates and coverage vary; an estimate is not an invoice.</desc>
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EFF6FF"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0078D4"/><stop offset="1" stop-color="#6366F1"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#0078D4" stroke-width="2"/></marker></defs>
<g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="560" rx="0" fill="#F8FAFC" stroke="none" stroke-width="2"/><circle cx="940" cy="8" r="180" fill="#E0F2FE" stroke="none" stroke-width="2"/><circle cx="12" cy="548" r="130" fill="#EEF2FF" stroke="none" stroke-width="2"/><text x="36" y="53" font-size="32" fill="#0F172A" font-weight="700" text-anchor="start">From measured usage to a cost estimate</text><text x="36" y="87" font-size="22" fill="#475569" font-weight="500" text-anchor="start">A meter records usage. An estimate needs every relevant assumption.</text><circle cx="138" cy="190" r="56" fill="#E0F2FE" stroke="none" stroke-width="2"/><g transform="translate(101 151) scale(0.6229508196721312)" fill="none" stroke="#0078D4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="21" y="12" width="79" height="87" rx="12"/><path d="M21 41H100M21 69H100"/><path d="M53 26H86M53 55H86M53 84H86"/><circle cx="36" cy="26" r="3"/><circle cx="36" cy="55" r="3"/><circle cx="36" cy="84" r="3"/></g><text x="138" y="277" font-size="22" fill="#0F172A" font-weight="700" text-anchor="middle">Runtime</text><circle cx="360" cy="190" r="56" fill="#E0F2FE" stroke="none" stroke-width="2"/><g transform="translate(323 151) scale(0.6229508196721312)" fill="none" stroke="#0078D4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="61" cy="24" rx="43" ry="17"/><path d="M18 24V92C18 115 104 115 104 92V24M18 49C18 73 104 73 104 49M18 73C18 96 104 96 104 73"/></g><text x="360" y="277" font-size="22" fill="#0F172A" font-weight="700" text-anchor="middle">Capacity</text><circle cx="581" cy="190" r="56" fill="#E0F2FE" stroke="none" stroke-width="2"/><g transform="translate(544 151) scale(0.6229508196721312)" fill="none" stroke="#0078D4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="61" cy="24" r="16"/><circle cx="23" cy="91" r="16"/><circle cx="100" cy="91" r="16"/><path d="M52 38L31 77M70 38L92 77M40 91H84"/></g><text x="581" y="277" font-size="22" fill="#0F172A" font-weight="700" text-anchor="middle">Transactions / transfer</text><path d="M215,189 L276,189" stroke="#0078D4" fill="none" stroke-width="3" marker-end="url(#arrow)"/><path d="M434,189 L497,189" stroke="#0078D4" fill="none" stroke-width="3" marker-end="url(#arrow)"/><path d="M663,189 L715,189" stroke="#0078D4" fill="none" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(743 137) scale(0.8852459016393442)" fill="none" stroke="#6366F1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 101A50 50 0 1 1 110 101M29 75L22 72M39 49L34 44M61 38V30M83 49L88 44M96 75L103 72M61 92L85 61"/><circle cx="61" cy="92" r="7"/></g><text x="797" y="279" font-size="22" fill="#0F172A" font-weight="500" text-anchor="middle">Usage × rate</text><text x="797" y="308" font-size="22" fill="#0F172A" font-weight="500" text-anchor="middle">Estimated cost</text><path d="M74 328H884" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(147 354) scale(0.6147540983606558)" fill="none" stroke="#6366F1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="61" cy="35" rx="44" ry="21"/><path d="M17 35V54C17 82 105 82 105 54V35M17 54V74C17 102 105 102 105 74V54"/><path d="M38 22L83 45M80 22L42 46"/></g><text x="184" y="457" font-size="24" fill="#0F172A" font-weight="700" text-anchor="middle">Pay as you go</text><text x="184" y="488" font-size="22" fill="#475569" font-weight="500" text-anchor="middle">Flexible usage</text><g transform="translate(443 354) scale(0.6147540983606558)" fill="none" stroke="#6366F1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="22" y="51" width="78" height="57" rx="14"/><path d="M38 51V32C38 3 85 3 85 32V51M61 73V89"/></g><text x="480" y="457" font-size="24" fill="#0F172A" font-weight="700" text-anchor="middle">Commitment</text><text x="480" y="488" font-size="22" fill="#475569" font-weight="500" text-anchor="middle">Eligible stable usage</text><g transform="translate(739 354) scale(0.6147540983606558)" fill="none" stroke="#6366F1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M70 7L24 67H57L45 114L102 49H70Z"/></g><text x="776" y="457" font-size="24" fill="#0F172A" font-weight="700" text-anchor="middle">Spot compute</text><text x="776" y="488" font-size="22" fill="#475569" font-weight="500" text-anchor="middle">Can be evicted</text><text x="480" y="535" font-size="22" fill="#475569" font-weight="500" text-anchor="middle">Rates vary by service, region, tier, licensing, and agreement.</text></g></svg>