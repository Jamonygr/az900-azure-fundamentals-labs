<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="title desc">
<title id="title">Turn signals into useful investigation</title><desc id="desc">Azure Monitor brings metrics, logs, and application telemetry into analysis. Log Analytics queries logs with KQL. Alert rules evaluate conditions and action groups route configured notifications or actions. Application Insights supports application-performance investigation. The lab uses read-only inspection and synthetic data, not a configured collection or alert pipeline.</desc>
