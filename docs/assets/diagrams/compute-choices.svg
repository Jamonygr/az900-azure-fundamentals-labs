<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="title desc">
<title id="title">Match the hosting service to the need</title><desc id="desc">A workload connects to five conceptual choices: a virtual machine for guest operating system control, App Service for managed website and API hosting, Functions for triggered code, containers for application packaging, and Azure Virtual Desktop for desktop and application access. Container hosting determines operational responsibilities.</desc>
