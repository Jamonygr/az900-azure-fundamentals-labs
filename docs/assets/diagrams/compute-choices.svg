1.3322919332995 L691.2670474096659,420.55934664507066" stroke="#0078D4" fill="none" stroke-width="3" marker-end="url(#arrow)"/><circle cx="743" cy="442" r="48" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><g transform="translate(712 411) scale(0.5081967213114754)" fill="none" stroke="#6366F1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="15" width="98" height="66" rx="10"/><path d="M61 81V100M39 101H83M28 36H46M28 47H62"/></g><text x="743" y="517" font-size="23" fill="#0F172A" font-weight="700" text-anchor="middle">Virtual Desktop</text><text x="743" y="547" font-size="22" fill="#475569" font-weight="500" text-anchor="middle">Desktop / apps</text></g></svg>