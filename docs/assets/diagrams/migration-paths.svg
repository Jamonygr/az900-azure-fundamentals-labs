<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="title desc">
<title id="title">Four paths for moving files and workloads</title><desc id="desc">One-time files can be transferred using AzCopy or Storage Explorer. Azure File Sync synchronizes Azure Files with supported Windows Server endpoints and can retain a local cache. Azure Migrate discovers, assesses, and migrates supported workloads. Data Box uses a physical device for supported offline transfers when network transfer is impractical. The lab copies one harmless blob and verifies matching content hashes.</desc>
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EFF6FF"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0078D4"/><stop offset="1" stop-color="#6366F1"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#0078D4" stroke-width="2"/></marker></defs>
<g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="640" rx="0" fill="#F8FAFC" stroke="none" stroke-width="2"/><circle cx="940" cy="8" r="180" fill="#E0F2FE" stroke="none" stroke-width="2"/><circle cx="12" cy="628" r="130" fill="#EEF2FF" stroke="none" stroke-width="2"/><text x="36" y="53" font-size="32" fill="#0F172A" font-weight="700" text-anchor="start">Four paths for moving files and workloads</text><text x="36" y="87" font-size="22" fill="#475569" font-weight="500" text-anchor="start">Match the tool to the source, destination, and migration need.</text><circle cx="92" cy="166" r="36" fill="#E0F2FE" stroke="none" stroke-width="2"/><g transform="translate(68 142) scale(0.39344262295081966)" fill="none" stroke="#0078D4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 9H74L100 35V112H24ZM74 9V35H100M40 57H84M40 74H84M40 91H68"/></g><text x="146" y="156" font-size="22" fill="#0F172A" font-weight="700" text-anchor="start">One-time copy</text><text x="146" y="187" font-size="22" fill="#6366F1" font-weight="700" text-anchor="start">AzCopy / Storage Explorer</text><path d="M452,165 L568,165" stroke="#0078D4" fill="none" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(592 134) scale(0.5163934426229508)" fill="none" stroke="#6366F1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="61" cy="24" rx="43" ry="17"/><path d="M18 24V92C18 115 104 115 104 92V24M18 49C18 73 104 73 104 49M18 73C18 96 104 96 104 73"/></g><text x="683" y="170" font-size="22" fill="#475569" font-weight="500" text-anchor="start">Azure storage</text><circle cx="92" cy="278" r="36" fill="#E0F2FE" stroke="none" stroke-width="2"/><g transform="translate(68 254) scale(0.39344262295081966)" fill="none" stroke="#0078D4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="21" y="12" width="79" height="87" rx="12"/><path d="M21 41H100M21 69H100"/><path d="M53 26H86M53 55H86M53 84H86"/><circle cx="36" cy="26" r="3"/><circle cx="36" cy="55" r="3"/><circle cx="36" cy="84" r="3"/></g><text x="146" y="268" font-size="22" fill="#0F172A" font-weight="700" text-anchor="start">Retained Windows server</text><text x="146" y="299" font-size="22" fill="#6366F1" font-weight="700" text-anchor="start">Azure File Sync</text><path d="M452,277 L568,277" stroke="#0078D4" fill="none" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(592 246) scale(0.5163934426229508)" fill="none" stroke="#6366F1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 30V17H48L61 31H111V99H10ZM10 46H111"/></g><text x="683" y="282" font-size="22" fill="#475569" font-weight="500" text-anchor="start">Azure Files + cache</text><circle cx="92" cy="390" r="36" fill="#E0F2FE" stroke="none" stroke-width="2"/><g transform="translate(68 366) scale(0.39344262295081966)" fill="none" stroke="#0078D4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 109V32L61 9L108 32V109ZM14 32H108M29 48H43V62H29ZM53 48H68V62H53ZM79 48H93V62H79ZM29 76H43V90H29ZM79 76H93V90H79ZM53 85H68V109H53Z"/></g><text x="146" y="380" font-size="22" fill="#0F172A" font-weight="700" text-anchor="start">Workload discovery</text><text x="146" y="411" font-size="22" fill="#6366F1" font-weight="700" text-anchor="start">Azure Migrate</text><path d="M452,389 L568,389" stroke="#0078D4" fill="none" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(592 358) scale(0.5163934426229508)" fill="none" stroke="#6366F1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M27 91H96C121 91 126 60 108 50C111 22 86 9 68 23C49 -2 11 12 13 40C-7 46 -5 77 16 83C18 88 23 91 27 91Z"/></g><text x="683" y="394" font-size="22" fill="#475569" font-weight="500" text-anchor="start">Assess → migrate</text><circle cx="92" cy="502" r="36" fill="#E0F2FE" stroke="none" stroke-width="2"/><g transform="translate(68 478) scale(0.39344262295081966)" fill="none" stroke="#0078D4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 33L61 7L113 33V90L61 115L9 90ZM9 33L61 60L113 33M61 60V115M35 20L87 47V68"/></g><text x="146" y="492" font-size="22" fill="#0F172A" font-weight="700" text-anchor="start">Network transfer impractical</text><text x="146" y="523" font-size="22" fill="#6366F1" font-weight="700" text-anchor="start">Data Box</text><path d="M452,501 L568,501" stroke="#0078D4" fill="none" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(592 470) scale(0.5163934426229508)" fill="none" stroke="#6366F1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="61" cy="24" rx="43" ry="17"/><path d="M18 24V92C18 115 104 115 104 92V24M18 49C18 73 104 73 104 49M18 73C18 96 104 96 104 73"/></g><text x="683" y="506" font-size="22" fill="#475569" font-weight="500" text-anchor="start">Physical data transfer</text><text x="480" y="610" font-size="22" fill="#475569" font-weight="500" text-anchor="middle">Validate dependencies, permissions, cutover, and content—not only the copy.</text></g></svg>