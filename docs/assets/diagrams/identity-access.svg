<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
<title id="title">Three different access decisions</title><desc id="desc">Authentication verifies identity; Conditional Access evaluates signals and requirements; Azure RBAC governs permitted Azure resource actions through principal, role definition, and scope.</desc>
<defs><linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient><linearGradient id="cloud" x2="0.8" y2="1"><stop stop-color="#E0F2FE"/><stop offset="1" stop-color="#A5B4FC"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#0078D4"/></marker></defs>
<rect width="960" height="560" rx="28" fill="url(#canvas)"/><circle cx="910" cy="40" r="155" fill="#22D3EE" opacity="0.05"/><circle cx="20" cy="560" r="190" fill="#6366F1" opacity="0.04"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="52" font-size="30" fill="#0F172A" font-weight="700" text-anchor="start">Three different access decisions</text><text x="40" y="88" font-size="22" fill="#475569" font-weight="400" text-anchor="start">Successful sign-in alone does not grant resource permission.</text><circle cx="170" cy="215" r="76" fill="#0078D4" opacity="0.08"/><g transform="translate(110 155) scale(1)" color="#0078D4"><circle cx="32" cy="40" r="25" fill="none" stroke="currentColor" stroke-width="13"/><path d="M49 59L100 110M78 88L94 72M92 102L106 88" stroke="currentColor" stroke-width="13" stroke-linejoin="round"/></g><text x="170" y="326" font-size="26" fill="#0078D4" font-weight="700" text-anchor="middle">Authentication</text><text x="170" y="362" font-size="22" fill="#475569" font-weight="400" text-anchor="middle">Who are you?</text><circle cx="480" cy="215" r="76" fill="#6366F1" opacity="0.08"/><g transform="translate(420 155) scale(1)" color="#6366F1"><path d="M60 8L108 26V60C108 91 79 111 60 118C41 111 12 91 12 60V26Z" fill="currentColor"/><path d="M35 61L52 78L86 43" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g><text x="480" y="326" font-size="26" fill="#6366F1" font-weight="700" text-anchor="middle">Conditional Access</text><text x="480" y="362" font-size="22" fill="#475569" font-weight="400" text-anchor="middle">What conditions apply?</text><circle cx="790" cy="215" r="76" fill="#0078D4" opacity="0.08"/><g transform="translate(730 155) scale(1)" color="#0078D4"><path d="M60 41V69M22 88V69H98V88" stroke="currentColor" stroke-width="6" fill="none"/><rect x="38" y="8" width="44" height="35" rx="8" fill="currentColor"/><rect x="1" y="84" width="44" height="35" rx="8" fill="currentColor"/><rect x="76" y="84" width="44" height="35" rx="8" fill="currentColor"/></g><text x="790" y="326" font-size="26" fill="#0078D4" font-weight="700" text-anchor="middle">Azure RBAC</text><text x="790" y="362" font-size="22" fill="#475569" font-weight="400" text-anchor="middle">Which actions are allowed?</text><rect x="45" y="408" width="870" height="112" rx="24" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="480" y="442" font-size="23" fill="#475569" font-weight="400" text-anchor="middle">A role assignment combines three things</text><text x="190" y="487" font-size="26" fill="#0078D4" font-weight="700" text-anchor="middle">Principal</text><text x="330" y="487" font-size="28" fill="#6366F1" font-weight="700" text-anchor="middle">+</text><text x="480" y="487" font-size="26" fill="#6366F1" font-weight="700" text-anchor="middle">Role definition</text><text x="642" y="487" font-size="28" fill="#0078D4" font-weight="700" text-anchor="middle">+</text><text x="775" y="487" font-size="26" fill="#0078D4" font-weight="700" text-anchor="middle">Scope</text></g></svg>