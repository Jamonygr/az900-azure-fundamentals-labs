<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
<title id="title">Three ways to organize cloud environments</title><desc id="desc">Public cloud supplies provider-owned services to multiple customers. Private cloud is dedicated to one organization. Hybrid cloud integrates private and public environments. Network access choices are distinct from deployment models; a private endpoint does not turn Azure into private cloud.</desc>
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EFF6FF"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0078D4"/><stop offset="1" stop-color="#6366F1"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#0078D4" stroke-width="2"/></marker></defs>
<g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="560" rx="0" fill="#F8FAFC" stroke="none" stroke-width="2"/><circle cx="940" cy="8" r="180" fill="#E0F2FE" stroke="none" stroke-width="2"/><circle cx="12" cy="548" r="130" fill="#EEF2FF" stroke="none" stroke-width="2"/><text x="36" y="53" font-size="32" fill="#0F172A" font-weight="700" text-anchor="start">Three ways to organize cloud environments</text><text x="36" y="87" font-size="22" fill="#475569" font-weight="500" text-anchor="start">Deployment model describes the environment, not data exposure.</text><text x="184" y="146" font-size="25" fill="#0F172A" font-weight="700" text-anchor="middle">Public cloud</text><text x="480" y="146" font-size="25" fill="#0F172A" font-weight="700" text-anchor="middle">Private cloud</text><text x="776" y="146" font-size="25" fill="#0F172A" font-weight="700" text-anchor="middle">Hybrid cloud</text><circle cx="184" cy="253" r="93" fill="#E0F2FE" stroke="none" stroke-width="2"/><g transform="translate(117 190) scale(1.098360655737705)" fill="none" stroke="#0078D4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M27 91H96C121 91 126 60 108 50C111 22 86 9 68 23C49 -2 11 12 13 40C-7 46 -5 77 16 83C18 88 23 91 27 91Z"/></g><g transform="translate(124 330) scale(0.5245901639344263)" fill="none" stroke="#0078D4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="61" cy="34" r="17"/><path d="M29 100V85C29 55 93 55 93 85V100"/><circle cx="18" cy="49" r="11"/><circle cx="105" cy="49" r="11"/><path d="M3 99V79C3 68 18 66 25 73M118 99V79C118 68 104 66 97 73"/></g><g transform="translate(207 330) scale(0.5245901639344263)" fill="none" stroke="#6366F1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="61" cy="34" r="17"/><path d="M29 100V85C29 55 93 55 93 85V100"/><circle cx="18" cy="49" r="11"/><circle cx="105" cy="49" r="11"/><path d="M3 99V79C3 68 18 66 25 73M118 99V79C118 68 104 66 97 73"/></g><text x="184" y="442" font-size="22" fill="#475569" font-weight="500" text-anchor="middle">Provider services</text><text x="184" y="471" font-size="22" fill="#475569" font-weight="500" text-anchor="middle">Multiple customers</text><circle cx="480" cy="253" r="93" fill="#EEF2FF" stroke="none" stroke-width="2"/><g transform="translate(424 200) scale(1.0)"><path d="M0 25L42 0L84 25L42 50Z" fill="#DBEAFE" stroke="#6366F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 25L42 50V136L0 111Z" fill="#EFF6FF" stroke="#6366F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 50L84 25V111L42 136Z" fill="#BFDBFE" stroke="#6366F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 51L31 63M10 73L31 85M10 95L31 107" fill="none" stroke="#6366F1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="70" r="3" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="60" cy="92" r="3" fill="#FFFFFF" stroke="none" stroke-width="2"/></g><g transform="translate(508 269) scale(0.48360655737704916)" fill="none" stroke="#6366F1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="22" y="51" width="78" height="57" rx="14"/><path d="M38 51V32C38 3 85 3 85 32V51M61 73V89"/></g><g transform="translate(448 334) scale(0.5245901639344263)" fill="none" stroke="#6366F1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="61" cy="34" r="17"/><path d="M29 100V85C29 55 93 55 93 85V100"/><circle cx="18" cy="49" r="11"/><circle cx="105" cy="49" r="11"/><path d="M3 99V79C3 68 18 66 25 73M118 99V79C118 68 104 66 97 73"/></g><text x="480" y="442" font-size="22" fill="#475569" font-weight="500" text-anchor="middle">Dedicated environment</text><text x="480" y="471" font-size="22" fill="#475569" font-weight="500" text-anchor="middle">One organization</text><g transform="translate(672 208) scale(0.6475409836065574)" fill="none" stroke="#6366F1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 109V32L61 9L108 32V109ZM14 32H108M29 48H43V62H29ZM53 48H68V62H53ZM79 48H93V62H79ZM29 76H43V90H29ZM79 76H93V90H79ZM53 85H68V109H53Z"/></g><g transform="translate(803 208) scale(0.8524590163934426)" fill="none" stroke="#0078D4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M27 91H96C121 91 126 60 108 50C111 22 86 9 68 23C49 -2 11 12 13 40C-7 46 -5 77 16 83C18 88 23 91 27 91Z"/></g><path d="M755,255 L800,255" stroke="#0078D4" fill="none" stroke-width="3" marker-end="url(#arrow)"/><path d="M798 280H752" fill="none" stroke="#6366F1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(747 319) scale(0.5573770491803278)" fill="none" stroke="#0078D4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="61" cy="24" r="16"/><circle cx="23" cy="91" r="16"/><circle cx="100" cy="91" r="16"/><path d="M52 38L31 77M70 38L92 77M40 91H84"/></g><text x="776" y="442" font-size="22" fill="#475569" font-weight="500" text-anchor="middle">Private + public</text><text x="776" y="471" font-size="22" fill="#475569" font-weight="500" text-anchor="middle">Integrated together</text><text x="480" y="527" font-size="22" fill="#475569" font-weight="500" text-anchor="middle">A private endpoint does not make Azure a private cloud.</text></g></svg>