<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 856" width="1000" height="856" role="img" aria-labelledby="title desc">
<title id="title">Three separate storage decisions</title>
<desc id="desc">Storage services meet different needs: Blob for objects, Files for shares, Queue for messages, Table for NoSQL entities, and managed disks for VM block storage. Hot, cool, and cold are online blob tiers; archive requires rehydration. LRS copies within one datacenter; ZRS spans primary-region zones. GRS and GZRS add asynchronous secondary-region replication with LRS in the secondary region. Redundancy does not replace backup.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64839a"/></marker></defs>
