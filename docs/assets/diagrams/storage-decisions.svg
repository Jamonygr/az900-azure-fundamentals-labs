<text x="32" y="770" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#435c72" font-weight="400" text-anchor="start">RA variants permit secondary reads where supported; asynchronous replication can lose recent writes.</text>
<text x="32" y="795" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#435c72" font-weight="400" text-anchor="start">Redundancy protects against infrastructure failures. Accidental deletion needs a recovery design.</text>
<text x="32" y="832" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#435c72" font-weight="400" text-anchor="start">Simplified copy layout. Service, tier, regional availability, and redundancy compatibility vary.</text>
