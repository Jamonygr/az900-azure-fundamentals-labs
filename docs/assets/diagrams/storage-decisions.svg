<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-labelledby="title desc">
<title id="title">Choose storage along three dimensions</title><desc id="desc">The top row shows Blob objects, Files shares, Queue messages, Table entities, and VM managed disks. The blob tier choices Hot, Cool, and Cold are online; Archive requires rehydration. The replication illustration distinguishes local LRS and zonal ZRS in the primary region, plus asynchronous secondary-region replication for GRS and GZRS. GZRS combines zonal primary replication with a geographic copy. The live lab uses Standard_LRS and Hot. Redundancy is not a backup.</desc>
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EFF6FF"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0078D4"/><stop offset="1" stop-color="#6366F1"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#0078D4" stroke-width="2"/></marker></defs>
