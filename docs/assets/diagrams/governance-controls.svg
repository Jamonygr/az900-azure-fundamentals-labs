<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
<title id="title">Choose the right governance control</title><desc id="desc">RBAC grants permitted actions, Policy evaluates rules at assigned scopes, and management locks restrict applicable control-plane changes. This lab creates an owned empty group and its CanNotDelete lock, while only reading Policy definitions.</desc>
<defs><linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient><linearGradient id="cloud" x2="0.8" y2="1"><stop stop-color="#E0F2FE"/><stop offset="1" stop-color="#A5B4FC"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#0078D4"/></marker></defs>
<rect width="960" height="560" rx="28" fill="url(#canvas)"/><circle cx="910" cy="40" r="155" fill="#22D3EE" opacity="0.05"/><circle cx="20" cy="560" r="190" fill="#6366F1" opacity="0.04"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="52" font-size="30" fill="#0F172A" font-weight="700" text-anchor="start">Choose the right governance control</text><text x="40" y="88" font-size="22" fill="#475569" font-weight="400" text-anchor="start">Permissions, policy rules, and locks have different effects.</text><circle cx="170" cy="212" r="76" fill="#0078D4" opacity="0.08"/><g transform="translate(110 152) scale(1)" color="#0078D4"><circle cx="32" cy="40" r="25" fill="none" stroke="currentColor" stroke-width="13"/><path d="M49 59L100 110M78 88L94 72M92 102L106 88" stroke="currentColor" stroke-width="13" stroke-linejoin="round"/></g><text x="170" y="325" font-size="27" fill="#0078D4" font-weight="700" text-anchor="middle">Azure RBAC</text><text x="170" y="361" font-size="23" fill="#475569" font-weight="400" text-anchor="middle">Who may act?</text><circle cx="480" cy="212" r="76" fill="#6366F1" opacity="0.08"/><g transform="translate(420 152) scale(1)" color="#6366F1"><rect x="18" y="13" width="84" height="102" rx="12" fill="currentColor"/><rect x="37" y="3" width="46" height="20" rx="7" fill="#A5B4FC"/><path d="M32 47L38 54L50 40M32 76L38 83L50 69M64 49H88M64 78H88" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/></g><text x="480" y="325" font-size="27" fill="#6366F1" font-weight="700" text-anchor="middle">Azure Policy</text><text x="480" y="361" font-size="23" fill="#475569" font-weight="400" text-anchor="middle">What is allowed?</text><circle cx="790" cy="212" r="76" fill="#0078D4" opacity="0.08"/><g transform="translate(730 152) scale(1)" color="#0078D4"><rect x="22" y="52" width="76" height="62" rx="13" fill="currentColor"/><path d="M36 54V35C36 1 84 1 84 35V54" fill="none" stroke="currentColor" stroke-width="13"/><circle cx="60" cy="78" r="7" fill="#FFFFFF"/><path d="M60 82V94" stroke="#FFFFFF" stroke-width="7"/></g><text x="790" y="325" font-size="27" fill="#0078D4" font-weight="700" text-anchor="middle">Resource locks</text><text x="790" y="361" font-size="23" fill="#475569" font-weight="400" text-anchor="middle">Which changes stop?</text><rect x="38" y="410" width="884" height="108" rx="24" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="480" y="450" font-size="25" fill="#0F172A" font-weight="700" text-anchor="middle">Lab: owned empty group + CanNotDelete lock</text><text x="480" y="489" font-size="22" fill="#475569" font-weight="400" text-anchor="middle">Policy definitions are inspected; no policy is assigned.</text></g></svg>