oke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 30V17H48L61 31H111V99H10ZM10 46H111"/></g><text x="184" y="361" font-size="23" fill="#0F172A" font-weight="700" text-anchor="start">Resource group</text><path d="M139,386 L170,411" stroke="#0078D4" fill="none" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(145 413) scale(0.4262295081967213)" fill="none" stroke="#0078D4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="21" y="12" width="79" height="87" rx="12"/><path d="M21 41H100M21 69H100"/><path d="M53 26H86M53 55H86M53 84H86"/><circle cx="36" cy="26" r="3"/><circle cx="36" cy="55" r="3"/><circle cx="36" cy="84" r="3"/></g><text x="214" y="447" font-size="23" fill="#0F172A" font-weight="700" text-anchor="start">Resource</text><rect x="524" y="161" width="383" height="298" rx="25" fill="#E0F2FE" stroke="#93C5FD" stroke-width="2"/><text x="715" y="202" font-size="25" fill="#0078D4" font-weight="700" text-anchor="middle">Azure region</text><rect x="544" y="225" width="105" height="205" rx="18" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/><g transform="translate(569 253) scale(0.65)"><path d="M0 25L42 0L84 25L42 50Z" fill="#DBEAFE" stroke="#0078D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 25L42 50V136L0 111Z" fill="#EFF6FF" stroke="#0078D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 50L84 25V111L42 136Z" fill="#BFDBFE" stroke="#0078D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 51L31 63M10 73L31 85M10 95L31 107" fill="none" stroke="#0078D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="70" r="3" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="60" cy="92" r="3" fill="#FFFFFF" stroke="none" stroke-width="2"/></g><text x="596" y="404" font-size="22" fill="#0F172A" font-weight="700" text-anchor="middle">Zone 1</text><rect x="659" y="225" width="105" height="205" rx="18" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/><g transform="translate(684 253) scale(0.65)"><path d="M0 25L42 0L84 25L42 50Z" fill="#DBEAFE" stroke="#0078D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 25L42 50V136L0 111Z" fill="#EFF6FF" stroke="#0078D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 50L84 25V111L42 136Z" fill="#BFDBFE" stroke="#0078D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 51L31 63M10 73L31 85M10 95L31 107" fill="none" stroke="#0078D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="70" r="3" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="60" cy="92" r="3" fill="#FFFFFF" stroke="none" stroke-width="2"/></g><text x="711" y="404" font-size="22" fill="#0F172A" font-weight="700" text-anchor="middle">Zone 2</text><rect x="774" y="225" width="105" height="205" rx="18" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/><g transform="translate(799 253) scale(0.65)"><path d="M0 25L42 0L84 25L42 50Z" fill="#DBEAFE" stroke="#0078D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 25L42 50V136L0 111Z" fill="#EFF6FF" stroke="#0078D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 50L84 25V111L42 136Z" fill="#BFDBFE" stroke="#0078D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 51L31 63M10 73L31 85M10 95L31 107" fill="none" stroke="#0078D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="70" r="3" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="60" cy="92" r="3" fill="#FFFFFF" stroke="none" stroke-width="2"/></g><text x="826" y="404" font-size="22" fill="#0F172A" font-weight="700" text-anchor="middle">Zone 3</text><text x="715" y="491" font-size="22" fill="#475569" font-weight="500" text-anchor="middle">Separate failure boundaries</text><text x="480" y="540" font-size="22" fill="#475569" font-weight="500" text-anchor="middle">A resource group location stores metadata; it does not fix resource locations.</text></g></svg>