<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" width="1000" height="670" role="img" aria-labelledby="title desc">
<title id="title">Two ways to locate an Azure resource</title>
<desc id="desc">Management scope flows from management groups to subscriptions to resource groups to resources. Resource groups organize related lifecycles; their location stores metadata. Geography flows from regions to availability zones to datacenters. Resource locations are chosen independently of a resource group metadata region.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64839a"/></marker></defs>
<rect width="1000" height="670" rx="20" fill="#f4f8fc"/>
<rect x="0" y="0" width="1000" height="8" fill="#0f766e"/>
<text x="32" y="49" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#15324d" font-weight="700" text-anchor="start">Two ways to locate an Azure resource</text>
<text x="32" y="79" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#435c72" font-weight="400" text-anchor="start">Logical management scopes and physical geography answer different questions.</text>
<text x="48" y="123" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#0369a1" font-weight="700" text-anchor="start">MANAGEMENT SCOPE</text>
<text x="536" y="123" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#0f766e" font-weight="700" text-anchor="start">PHYSICAL GEOGRAPHY</text>
<rect x="48" y="148" width="330" height="95" rx="12" fill="#ffffff" stroke="#cbdbe6" stroke-width="1.5"/>
<rect x="48" y="161" width="4" height="69" rx="2" fill="#0369a1"/>
<text x="68" y="182" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#0369a1" font-weight="700" text-anchor="start">Management group</text>
<text x="68" y="212" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#435c72" font-weight="400" text-anchor="start">Organizes subscriptions</text>
<text x="68" y="237" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#435c72" font-weight="400" text-anchor="start">Governance can inherit down</text>
<rect x="78" y="265" width="330" height="70" rx="12" fill="#ffffff" stroke="#cbdbe6" stroke-width="1.5"/>
<rect x="78" y="278" width="4" height="44" rx="2" fill="#0369a1"/>
<text x="98" y="299" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#0369a1" font-weight="700" text-anchor="start">Subscription</text>
<text x="98" y="329" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#435c72" font-weight="400" text-anchor="start">Billing and access boundary</text>
<path d="M 213 243 V 256 H 243 V 265" fill="none" stroke="#64839a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="108" y="357" width="330" height="70" rx="12" fill="#ffffff" stroke="#cbdbe6" stroke-width="1.5"/>
<rect x="108" y="370" width="4" height="44" rx="2" fill="#0369a1"/>
<text x="128" y="391" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#0369a1" font-weight="700" text-anchor="start">Resource group</text>
<text x="128" y="421" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#435c72" font-weight="400" text-anchor="start">Related resource lifecycle</text>
<path d="M 243 335 V 348 H 273 V 357" fill="none" stroke="#64839a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="138" y="449" width="330" height="70" rx="12" fill="#ffffff" stroke="#cbdbe6" stroke-width="1.5"/>
<rect x="138" y="462" width="4" height="44" rx="2" fill="#0369a1"/>
<text x="158" y="483" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#0369a1" font-weight="700" text-anchor="start">Resource</text>
<text x="158" y="513" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#435c72" font-weight="400" text-anchor="start">VNet, storage account, VM…</text>
<path d="M 273 427 V 440 H 303 V 449" fill="none" stroke="#64839a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="536" y="148" width="416" height="370" rx="12" fill="#eaf5f1" stroke="#9ccfc4" stroke-width="1.5"/>
<text x="556" y="181" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#0f766e" font-weight="700" text-anchor="start">Region</text>
<text x="556" y="209" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#435c72" font-weight="400" text-anchor="start">Geographic area with datacenters</text>
<text x="556" y="234" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#435c72" font-weight="400" text-anchor="start">Zone and service support vary.</text>
<rect x="556" y="258" width="117" height="157" rx="12" fill="#ffffff" stroke="#9ccfc4" stroke-width="1.5"/>
<text x="614" y="289" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#0f766e" font-weight="700" text-anchor="middle">Zone 1</text>
<rect x="569" y="310" width="91" height="80" rx="7" fill="#e5f5f1" stroke="#c2dfd7" stroke-width="1.5"/>
<text x="614" y="340" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#15324d" font-weight="700" text-anchor="middle">Datacenter</text>
<text x="614" y="362" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#435c72" font-weight="400" text-anchor="middle">group</text>
<rect x="685" y="258" width="117" height="157" rx="12" fill="#ffffff" stroke="#9ccfc4" stroke-width="1.5"/>
<text x="743" y="289" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#0f766e" font-weight="700" text-anchor="middle">Zone 2</text>
<rect x="698" y="310" width="91" height="80" rx="7" fill="#e5f5f1" stroke="#c2dfd7" stroke-width="1.5"/>
<text x="743" y="340" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#15324d" font-weight="700" text-anchor="middle">Datacenter</text>
<text x="743" y="362" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#435c72" font-weight="400" text-anchor="middle">group</text>
<rect x="814" y="258" width="117" height="157" rx="12" fill="#ffffff" stroke="#9ccfc4" stroke-width="1.5"/>
<text x="872" y="289" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#0f766e" font-weight="700" text-anchor="middle">Zone 3</text>
<rect x="827" y="310" width="91" height="80" rx="7" fill="#e5f5f1" stroke="#c2dfd7" stroke-width="1.5"/>
<text x="872" y="340" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#15324d" font-weight="700" text-anchor="middle">Datacenter</text>
<text x="872" y="362" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#435c72" font-weight="400" text-anchor="middle">group</text>
<text x="556" y="455" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#435c72" font-weight="400" text-anchor="start">Zones have separate power, cooling,</text>
<text x="556" y="480" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#435c72" font-weight="400" text-anchor="start">and networking failure boundaries.</text>
<rect x="48" y="551" width="904" height="64" rx="12" fill="#ffffff" stroke="#cbdbe6" stroke-width="1.5"/>
<text x="67" y="577" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#435c72" font-weight="400" text-anchor="start">A resource group’s location stores its metadata; its resources may be in different regions.</text>
<text x="67" y="602" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#435c72" font-weight="400" text-anchor="start">Region pairing does not automatically replicate your application or its data.</text>
<text x="32" y="646" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#435c72" font-weight="400" text-anchor="start">Conceptual scope and geography diagram. No management groups, subscriptions, or zones are deployed here.</text>
</svg>
