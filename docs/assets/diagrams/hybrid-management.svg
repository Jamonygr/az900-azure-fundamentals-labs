<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
<title id="title">Extend management with Azure Arc</title><desc id="desc">Azure Arc creates an Azure resource representation of supported external infrastructure. A connected server can remain in the organization’s datacenter. Portal, CLI, PowerShell, and Cloud Shell are management interfaces, not migrations or permission bypasses.</desc>
<defs><linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient><linearGradient id="cloud" x2="0.8" y2="1"><stop stop-color="#E0F2FE"/><stop offset="1" stop-color="#A5B4FC"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#0078D4"/></marker></defs>
<rect width="960" height="560" rx="28" fill="url(#canvas)"/><circle cx="910" cy="40" r="155" fill="#22D3EE" opacity="0.05"/><circle cx="20" cy="560" r="190" fill="#6366F1" opacity="0.04"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="52" font-size="30" fill="#0F172A" font-weight="700" text-anchor="start">Extend management with Azure Arc</text><text x="40" y="88" font-size="22" fill="#475569" font-weight="400" text-anchor="start">A connection extends management; it does not move the workload.</text><rect x="48" y="145" width="275" height="332" rx="24" fill="#FFFFFF" stroke="none" stroke-width="2" /><rect x="636" y="145" width="276" height="332" rx="24" fill="#FFFFFF" stroke="none" stroke-width="2" /><circle cx="184" cy="265" r="76" fill="#6366F1" opacity="0.08"/><g transform="translate(124 205) scale(1)" color="#6366F1"><rect x="23" y="8" width="74" height="105" rx="14" fill="currentColor"/><path d="M34 37H86M34 62H86M34 87H86" stroke="#FFFFFF" stroke-width="6"/><circle cx="43" cy="23" r="4" fill="#FFFFFF"/><circle cx="43" cy="49" r="4" fill="#FFFFFF"/><circle cx="43" cy="75" r="4" fill="#FFFFFF"/></g><text x="184" y="385" font-size="26" fill="#6366F1" font-weight="700" text-anchor="middle">Your datacenter</text><text x="184" y="427" font-size="22" fill="#475569" font-weight="400" text-anchor="middle">Workload stays here</text><circle cx="774" cy="265" r="76" fill="#0078D4" opacity="0.08"/><g transform="translate(714 205) scale(1)" color="#0078D4"><path d="M23 87C0 86 2 50 25 49C25 10 81 1 93 43C124 36 139 81 110 89Z" fill="url(#cloud)" stroke="currentColor" stroke-width="4"/><path d="M31 86H104" stroke="#FFFFFF" stroke-width="5"/></g><text x="774" y="385" font-size="26" fill="#0078D4" font-weight="700" text-anchor="middle">Azure management</text><text x="774" y="427" font-size="22" fill="#475569" font-weight="400" text-anchor="middle">Resource representation</text><path d="M324 260C413 156 546 156 635 260" fill="none" stroke="#22D3EE" stroke-width="7"/><text x="480" y="167" font-size="28" fill="#0078D4" font-weight="700" text-anchor="middle">Azure Arc</text><g transform="translate(429 251) scale(0.85)" color="#0078D4"><path d="M60 41V69M22 88V69H98V88" stroke="currentColor" stroke-width="6" fill="none"/><rect x="38" y="8" width="44" height="35" rx="8" fill="currentColor"/><rect x="1" y="84" width="44" height="35" rx="8" fill="currentColor"/><rect x="76" y="84" width="44" height="35" rx="8" fill="currentColor"/></g><text x="480" y="384" font-size="23" fill="#0078D4" font-weight="700" text-anchor="middle">Connect + govern</text><text x="480" y="525" font-size="23" fill="#475569" font-weight="400" text-anchor="middle">Portal • Azure CLI • Azure PowerShell • Cloud Shell</text></g></svg>