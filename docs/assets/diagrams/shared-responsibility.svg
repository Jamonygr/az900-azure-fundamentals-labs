<text x="49" y="533" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#0f766e" font-weight="400" text-anchor="start">Owned devices, application configuration, and safe use still require deliberate customer action.</text>
<text x="32" y="588" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#435c72" font-weight="400" text-anchor="start">Simplified comparison. Exact shared responsibilities depend on the service and its configuration.</text>
