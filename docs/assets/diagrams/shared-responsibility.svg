<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 612" width="1000" height="612" role="img" aria-labelledby="title desc">
<title id="title">Who manages which layer?</title>
<desc id="desc">A simplified shared-responsibility matrix. Customers manage data and access choices for IaaS, PaaS, and SaaS. Customers manage their application code for IaaS and PaaS; the provider manages the SaaS application. Customers manage the IaaS guest operating system; the provider manages PaaS and SaaS operating systems. The provider manages physical infrastructure in all three.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64839a"/></marker></defs>
<rect width="1000" height="612" rx="20" fill="#f4f8fc"/>
<rect x="0" y="0" width="1000" height="8" fill="#0f766e"/>
<text x="32" y="49" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#15324d" font-weight="700" text-anchor="start">Who manages which layer?</text>
<text x="32" y="79" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#435c72" font-weight="400" text-anchor="start">Service models shift operational work; customers still own their data and access decisions.</text>
<text x="482" y="125" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#0369a1" font-weight="700" text-anchor="middle">IaaS</text>
<text x="482" y="150" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#435c72" font-weight="400" text-anchor="middle">Virtual machine</text>
<text x="674" y="125" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#0369a1" font-weight="700" text-anchor="middle">PaaS</text>
<text x="674" y="150" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#435c72" font-weight="400" text-anchor="middle">Managed app platform</text>
<text x="866" y="125" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#0369a1" font-weight="700" text-anchor="middle">SaaS</text>
<text x="866" y="150" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#435c72" font-weight="400" text-anchor="middle">Finished application</text>
