ll="#475569" font-weight="500" text-anchor="middle">+ region</text><circle cx="243" cy="153" r="20" fill="#0078D4" stroke="none" stroke-width="2"/><text x="243" y="160" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><circle cx="399" cy="242" r="49" fill="#FFFFFF" stroke="#0078D4" stroke-width="2"/><g transform="translate(367 210) scale(0.5245901639344263)" fill="none" stroke="#0078D4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 61C31 20 90 20 118 61C90 102 31 102 4 61Z"/><circle cx="61" cy="61" r="19"/></g><text x="399" y="320" font-size="24" fill="#0F172A" font-weight="700" text-anchor="middle">Preview</text><text x="399" y="352" font-size="19" fill="#475569" font-weight="500" text-anchor="middle">Zero Azure calls</text><circle cx="399" cy="153" r="20" fill="#0078D4" stroke="none" stroke-width="2"/><text x="399" y="160" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><circle cx="555" cy="242" r="49" fill="#FFFFFF" stroke="#6366F1" stroke-width="2"/><g transform="translate(523 210) scale(0.5245901639344263)" fill="none" stroke="#6366F1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M70 7L24 67H57L45 114L102 49H70Z"/></g><text x="555" y="320" font-size="24" fill="#0F172A" font-weight="700" text-anchor="middle">Execute</text><text x="555" y="352" font-size="19" fill="#475569" font-weight="500" text-anchor="middle">Explicit flags</text><circle cx="555" cy="153" r="20" fill="#6366F1" stroke="none" stroke-width="2"/><text x="555" y="160" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><circle cx="711" cy="242" r="49" fill="#FFFFFF" stroke="#0078D4" stroke-width="2"/><g transform="translate(679 210) scale(0.5245901639344263)" fill="none" stroke="#0078D4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="61" cy="61" r="46"/><path d="M34 60L53 80L88 42"/></g><text x="711" y="320" font-size="24" fill="#0F