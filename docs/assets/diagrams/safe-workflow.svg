<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
<title id="title">A safe lab run, from start to finish</title><desc id="desc">A six-step safety path: prepare PowerShell and Azure CLI, choose an explicit subscription and region, preview without Azure calls, execute with explicit flags, validate the expected resource settings and ownership, then verify that the owned resource group is absent after cleanup. Ownership checks guard changes. Budget alerts do not cap spending.</desc>
