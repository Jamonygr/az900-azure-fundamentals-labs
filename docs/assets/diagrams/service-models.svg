<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
<title id="title">Infrastructure, platform, or finished software</title><desc id="desc">Three platforms show the control required for IaaS guest operating systems, PaaS application code, and SaaS finished software. An event triggers serverless code; the customer still manages logic, dependencies, access, and telemetry. Serverless hosting and billing depend on the plan.</desc>
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EFF6FF"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0078D4"/><stop offset="1" stop-color="#6366F1"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#0078D4" stroke-width="2"/></marker></defs>
<g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="560" rx="0" fill="#F8FAFC" stroke="none" stroke-width="2"/><circle cx="940" cy="8" r="180" fill="#E0F2FE" stroke="none" stroke-width="2"/><circle cx="12" cy="548" r="130" fill="#EEF2FF" stroke="none" stroke-width="2"/><text x="36" y="53" font-size="32" fill="#0F172A" font-weight="700" text-anchor="start">Infrastructure, platform, or finished software</text><text x="36" y="87" font-size="22" fill="#475569" font-weight="500" text-anchor="start">Choose the control you need, then the service model.</text><rect x="90" y="196" width="218" height="100" rx="14" fill="url(#blue)" stroke="none" stroke-width="2"/><g transform="translate(150 116) scale(0.8114754098360656)" fill="none" stroke="#0078D4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="21" y="12" width="79" height="87" rx="12"/><path d="M21 41H100M21 69H100"/><path d="M53 26H86M53 55H86M53 84H86"/><circle cx="36" cy="26" r="3"/><circle cx="36" cy="55" r="3"/><circle cx="36" cy="84" r="3"/></g><text x="199" y="335" font-size="28" fill="#0F172A" font-weight="700" text-anchor="middle">IaaS</text><text x="199" y="367" font-size="22" fill="#475569" font-weight="500" text-anchor="middle">Operate guest OS</text><rect x="371" y="227" width="218" height="69" rx="14" fill="url(#blue)" stroke="none" stroke-width="2"/><g transform="translate(431 126) scale(0.8114754098360656)" fill="none" stroke="#6366F1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="19" width="107" height="82" rx="12"/><path d="M42 42L24 60L42 78M80 42L98 60L80 78M68 36L55 86"/></g><text x="480" y="335" font-size="28" fill="#0F172A" font-weight="700" text-anchor="middle">PaaS</text><text x="480" y="367" font-size="22" fill="#475569" font-weight="500" text-anchor="middle">Deploy your code</text><rect x="652" y="257" width="218" height="39" rx="14" fill="url(#blue)" stroke="none" stroke-width="2"/><g transform="translate(712 136) scale(0.8114754098360656)" fill="none" stroke="#6366F1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="15" width="98" height="66" rx="10"/><path d="M61 81V100M39 101H83M28 36H46M28 47H62"/></g><text x="761" y="335" font-size="28" fill="#0F172A" font-weight="700" text-anchor="middle">SaaS</text><text x="761" y="367" font-size="22" fill="#475569" font-weight="500" text-anchor="middle">Use finished software</text><rect x="67" y="411" width="826" height="111" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><g transform="translate(89 433) scale(0.5409836065573771)" fill="none" stroke="#0078D4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 9H74L100 35V112H24ZM74 9V35H100M40 57H84M40 74H84M40 91H68"/></g><path d="M177,470 L225,470" stroke="#0078D4" fill="none" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(245 432) scale(0.5573770491803278)" fill="none" stroke="#6366F1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M70 7L24 67H57L45 114L102 49H70Z"/></g><path d="M331,470 L382,470" stroke="#0078D4" fill="none" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(400 434) scale(0.5655737704918032)" fill="none" stroke="#0078D4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="19" width="107" height="82" rx="12"/><path d="M42 42L24 60L42 78M80 42L98 60L80 78M68 36L55 86"/></g><text x="501" y="455" font-size="24" fill="#0F172A" font-weight="700" text-anchor="start">Serverless: event → code</text><text x="501" y="487" font-size="22" fill="#475569" font-weight="500" text-anchor="start">You still own logic and access.</text></g></svg>