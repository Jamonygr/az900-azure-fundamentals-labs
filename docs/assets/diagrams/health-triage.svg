<g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="52" font-size="30" fill="#0F172A" font-weight="700" text-anchor="start">Ask the right health question</text><text x="40" y="88" font-size="22" fill="#475569" font-weight="400" text-anchor="start">Read-only inspection; no recommendation, resource, or notification is changed.</text><rect x="40" y="131" width="420" height="196" rx="24" fill="#FFFFFF" stroke="none" stroke-width="2" /><circle cx="116" cy="207" r="57" fill="#0078D4" opacity="0.08"/><g transform="translate(74.0 165.0) scale(0.7)" color="#0078D4"><circle cx="60" cy="60" r="50" fill="none" stroke="currentColor" stroke-width="6"/><ellipse cx="60" cy="60" rx="23" ry="50" fill="none" stroke="currentColor" stroke-width="5"/><path d="M11 60H109M20 32H100M20 88H100" stroke="currentColor" stroke-width="5"/></g><text x="191" y="192" font-size="25" fill="#0078D4" font-weight="700" text-anchor="start">Azure Status</text><text x="64" y="295" font-size="22" fill="#475569" font-weight="400" text-anchor="start">Public, broad service notices</text><rect x="500" y="131" width="420" height="196" rx="24" fill="#FFFFFF" stroke="none" stroke-width="2" /><circle cx="576" cy="207" r="57" fill="#6366F1" opacity="0.08"/><g transform="translate(534.0 165.0) scale(0.7)" color="#6366F1"><path d="M29 72V44C29 4 91 4 91 44V72L106 93H14Z" fill="currentColor"/><path d="M44 103C44 123 76 123 76 103" fill="currentColor"/><circle cx="61" cy="8" r="8" fill="currentColor"/></g><text x="651" y="192" font-size="25" fill="#6366F1" font-weight="700" text-anchor="start">Service Health</text><text x="524" y="295" font-size="22" fill="#475569" font-weight="400" text-anchor="start">Your subscription’s incidents</text><rect x="40" y="354" width="420" height="196" rx="24" fill="#FFFFFF" stroke="none" stroke-width="2" /><circle cx="116" cy="430" r="57" fill="#6366F1" opacity="0.08"/><g transform="translate(74.0 388.0) scale(0.7)" color="#6366F1"><path d="M60 111L17 70C-17 34 29 -1 60 32C91 -1 137 34 103 70Z" fill="currentColor"/><path d="M15 65H37L48 43L64 84L77 60H107" fill="none" stroke="#FFFFFF" stroke-width="6"/></g><text x="191" y="415" font-size="25" fill="#6366F1" font-weight="700" text-anchor="start">Resource Health</text><text x="64" y="518" font-size="22" fill="#475569" font-weight="400" text-anchor="start">One supported resource</text><rect x="500" y="354" width="420" height="196" rx="24" fill="#FFFFFF" stroke="none" stroke-width="2" /><circle cx="576" cy="430" r="57" fill="#0078D4" opacity="0.08"/><g transform="translate(534.0 388.0) scale(0.7)" color="#0078D4"><path d="M14 13V105H111" fill="none" stroke="currentColor" stroke-width="6"/><rect x="29" y="70" width="17" height="27" rx="4" fill="currentColor"/><rect x="57" y="47" width="17" height="50" rx="4" fill="#A5B4FC"/><rect x="85" y="19" width="17" height="78" rx="4" fill="currentColor"/></g><text x="651" y="415" font-size="25" fill="#0078D4" font-weight="700" text-anchor="start">Azure Advisor</text><text x="524" y="518" font-size="22" fill="#475569" font-weight="400" text-anchor="start">Deployment recommendations</text></g></svg>