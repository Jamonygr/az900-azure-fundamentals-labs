<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" role="img" aria-labelledby="title desc">
<title id="title">Ask the right health question</title><desc id="desc">Azure Status publishes broad notices. Service Health personalizes service incidents and maintenance affecting a subscription. Resource Health concerns individual supported resources. Advisor offers recommendations and is not an outage detector.</desc>
