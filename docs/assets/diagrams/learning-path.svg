<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 485" width="1000" height="485" role="img" aria-labelledby="title desc">
<title id="title">Your AZ-900 learning path</title>
<desc id="desc">Start with Lab 00. Study five cloud concept labs, eight architecture and service labs, and seven management and governance labs. Each of Labs 01 through 20 has thirty practice questions. Finish with the integrated capstone and cleanup.</desc>
