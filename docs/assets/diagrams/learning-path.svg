<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-labelledby="title desc">
<title id="title">Your route to Azure Fundamentals</title><desc id="desc">Start at Lab 00 with tools, context, costs, and cleanup. Follow five cloud concept labs with 150 questions, eight architecture and services labs with 240 questions, and seven management and governance labs with 210 questions. The official exam weights are 25 to 30 percent, 35 to 40 percent, and 30 to 35 percent. Finish at Lab 21 with integrated deployment, validation, troubleshooting, and cleanup.</desc>
