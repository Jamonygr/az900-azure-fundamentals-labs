<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
<title id="title">From reviewed source to observed state</title><desc id="desc">Bicep compiles into an ARM template. Azure Resource Manager handles an authorized deployment. This exercise creates an owned VNet and subnet, then compares actual configuration with the intended source to detect drift.</desc>
<defs><linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient><linearGradient id="cloud" x2="0.8" y2="1"><stop stop-color="#E0F2FE"/><stop offset="1" stop-color="#A5B4FC"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#0078D4"/></marker></defs>
<rect width="960" height="560" rx="28" fill="url(#canvas)"/><circle cx="910" cy="40" r="155" fill="#22D3EE" opacity="0.05"/><circle cx="20" cy="560" r="190" fill="#6366F1" opacity="0.04"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="52" font-size="30" fill="#0F172A" font-weight="700" text-anchor="start">From reviewed source to observed state</text><text x="40" y="88" font-size="22" fill="#475569" font-weight="400" text-anchor="start">Local compilation succeeds before live permissions and policy are evaluated.</text><circle cx="150" cy="221" r="73" fill="#6366F1" opacity="0.08"/><g transform="translate(90 161) scale(1)" color="#6366F1"><rect x="4" y="15" width="112" height="93" rx="14" fill="currentColor"/><path d="M40 40L21 62L40 84M79 40L98 62L79 84M70 34L51 90" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/></g><text x="150" y="332" font-size="26" fill="#6366F1" font-weight="700" text-anchor="middle">Bicep source</text><text x="150" y="370" font-size="22" fill="#475569" font-weight="400" text-anchor="middle">Review + parameters</text><circle cx="480" cy="221" r="73" fill="#0078D4" opacity="0.08"/><g transform="translate(420 161) scale(1)" color="#0078D4"><path d="M24 8H77L102 34V113H24Z" fill="currentColor"/><path d="M77 8V34H102M40 54H84M40 73H84M40 92H73" fill="none" stroke="#FFFFFF" stroke-width="6"/></g><text x="480" y="332" font-size="26" fill="#0078D4" font-weight="700" text-anchor="middle">ARM template</text><text x="480" y="370" font-size="22" fill="#475569" font-weight="400" text-anchor="middle">JSON deployment definition</text><circle cx="810" cy="221" r="73" fill="#0078D4" opacity="0.08"/><g transform="translate(750 161) scale(1)" color="#0078D4"><path d="M60 41V69M22 88V69H98V88" stroke="currentColor" stroke-width="6" fill="none"/><rect x="38" y="8" width="44" height="35" rx="8" fill="currentColor"/><rect x="1" y="84" width="44" height="35" rx="8" fill="currentColor"/><rect x="76" y="84" width="44" height="35" rx="8" fill="currentColor"/></g><text x="810" y="332" font-size="26" fill="#0078D4" font-weight="700" text-anchor="middle">VNet + subnet</text><text x="810" y="370" font-size="22" fill="#475569" font-weight="400" text-anchor="middle">Validate actual state</text><path d="M255 221 L366 221" fill="none" stroke="#0078D4" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" /><text x="310" y="184" font-size="22" fill="#475569" font-weight="400" text-anchor="middle">Compile</text><path d="M586 221 L701 221" fill="none" stroke="#0078D4" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" /><text x="645" y="184" font-size="22" fill="#475569" font-weight="400" text-anchor="middle">Deploy</text><path d="M810 405V473H150V405" fill="none" stroke="#6366F1" stroke-width="3" stroke-dasharray="9 7"/><text x="480" y="510" font-size="24" fill="#6366F1" font-weight="700" text-anchor="middle">Compare intended state with observed state</text></g></svg>