<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
<title id="title">Estimate, observe, and respond</title><desc id="desc">Pricing calculator estimates use assumptions and service meters. Cost Management analyzes recorded charges and forecasts. Budgets notify at configured thresholds rather than guaranteeing automatic shutdown. Tags provide non-sensitive organizational metadata.</desc>
<defs><linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient><linearGradient id="cloud" x2="0.8" y2="1"><stop stop-color="#E0F2FE"/><stop offset="1" stop-color="#A5B4FC"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#0078D4"/></marker></defs>
<rect width="960" height="560" rx="28" fill="url(#canvas)"/><circle cx="910" cy="40" r="155" fill="#22D3EE" opacity="0.05"/><circle cx="20" cy="560" r="190" fill="#6366F1" opacity="0.04"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="52" font-size="30" fill="#0F172A" font-weight="700" text-anchor="start">Estimate, observe, and respond</text><text x="40" y="88" font-size="22" fill="#475569" font-weight="400" text-anchor="start">The live exercise creates only an empty, owned resource group.</text><circle cx="170" cy="211" r="76" fill="#0078D4" opacity="0.08"/><g transform="translate(110 151) scale(1)" color="#0078D4"><path d="M10 97A52 52 0 0 1 110 97" fill="none" stroke="#CBD5E1" stroke-width="14"/><path d="M10 97A52 52 0 0 1 70 46" fill="none" stroke="currentColor" stroke-width="14"/><path d="M60 97L88 61" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><circle cx="60" cy="97" r="9" fill="currentColor"/></g><text x="170" y="322" font-size="28" fill="#0078D4" font-weight="700" text-anchor="middle">Estimate</text><text x="170" y="358" font-size="22" fill="#475569" font-weight="400" text-anchor="middle">Assumptions + meters</text><circle cx="480" cy="211" r="76" fill="#6366F1" opacity="0.08"/><g transform="translate(420 151) scale(1)" color="#6366F1"><path d="M14 13V105H111" fill="none" stroke="currentColor" stroke-width="6"/><rect x="29" y="70" width="17" height="27" rx="4" fill="currentColor"/><rect x="57" y="47" width="17" height="50" rx="4" fill="#A5B4FC"/><rect x="85" y="19" width="17" height="78" rx="4" fill="currentColor"/></g><text x="480" y="322" font-size="28" fill="#6366F1" font-weight="700" text-anchor="middle">Analyze</text><text x="480" y="358" font-size="22" fill="#475569" font-weight="400" text-anchor="middle">Charges + forecasts</text><circle cx="790" cy="211" r="76" fill="#0078D4" opacity="0.08"/><g transform="translate(730 151) scale(1)" color="#0078D4"><path d="M29 72V44C29 4 91 4 91 44V72L106 93H14Z" fill="currentColor"/><path d="M44 103C44 123 76 123 76 103" fill="currentColor"/><circle cx="61" cy="8" r="8" fill="currentColor"/></g><text x="790" y="322" font-size="28" fill="#0078D4" font-weight="700" text-anchor="middle">Budget</text><text x="790" y="358" font-size="22" fill="#475569" font-weight="400" text-anchor="middle">Threshold notifications</text><path d="M274 218 L362 218" fill="none" stroke="#0078D4" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" /><path d="M584 218 L672 218" fill="none" stroke="#0078D4" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" /><rect x="38" y="406" width="884" height="112" rx="24" fill="#FFFFFF" stroke="none" stroke-width="2" /><g transform="translate(58 419) scale(0.7)" color="#6366F1"><path d="M13 15H64L110 61L58 113L13 67Z" fill="currentColor"/><circle cx="36" cy="38" r="9" fill="#FFFFFF"/><path d="M51 68L70 49M65 82L84 63" stroke="#FFFFFF" stroke-width="5"/></g><text x="174" y="447" font-size="25" fill="#0F172A" font-weight="700" text-anchor="start">Tags organize and allocate spend</text><text x="174" y="484" font-size="22" fill="#475569" font-weight="400" text-anchor="start">A budget alone does not shut down all services.</text></g></svg>