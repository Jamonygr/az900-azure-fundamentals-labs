<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
<title id="title">A small network, with bigger connection choices</title><desc id="desc">The lab deploys one virtual network with address space 10.90.0.0/16 and an empty subnet called subnet-default with prefix 10.90.1.0/24. Dashed conceptual paths show peering to another VNet, VPN or ExpressRoute to an office, and private endpoint plus DNS to an Azure service. These connections are not deployed by the lab. Peering is nontransitive; connectivity does not replace authorization.</desc>
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EFF6FF"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0078D4"/><stop offset="1" stop-color="#6366F1"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#0078D4" stroke-width="2"/></marker></defs>
<g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="560" rx="0" fill="#F8FAFC" stroke="none" stroke-width="2"/><circle cx="940" cy="8" r="180" fill="#E0F2FE" stroke="none" stroke-width="2"/><circle cx="12" cy="548" r="130" fill="#EEF2FF" stroke="none" stroke-width="2"/><text x="36" y="53" font-size="32" fill="#0F172A" font-weight="700" text-anchor="start">A small network, with bigger connection choices</text><text x="36" y="87" font-size="22" fill="#475569" font-weight="500" text-anchor="start">Address space, connectivity, DNS, and access are separate decisions.</text><rect x="42" y="132" width="393" height="327" rx="23" fill="#E0F2FE" stroke="#0078D4" stroke-width="2"/><text x="64" y="169" font-size="23" fill="#0078D4" font-weight="700" text-anchor="start">Lab VNet · 10.90.0.0/16</text><rect x="78" y="204" width="321" height="183" rx="19" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><g transform="translate(190 220) scale(0.639344262295082)" fill="none" stroke="#0078D4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="61" cy="24" r="16"/><circle cx="23" cy="91" r="16"/><circle cx="100" cy="91" r="16"/><path d="M52 38L31 77M70 38L92 77M40 91H84"/></g><text x="238" y="322" font-size="23" fill="#0F172A" font-weight="700" text-anchor="middle">subnet-default</text><text x="238" y="355" font-size="22" fill="#475569" font-weight="500" text-anchor="middle">10.90.1.0/24 · empty</text><rect x="81" y="411" width="268" height="34" rx="17" fill="#E0F2FE" stroke="none" stroke-width="2"/><text x="215.0" y="435" font-size="19" fill="#0078D4" font-weight="700" text-anchor="middle">Deployed by this lab</text><path d="M444,186 L544,186" stroke="#0078D4" fill="none" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 7"/><g transform="translate(560 148) scale(0.5901639344262295)" fill="none" stroke="#6366F1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="61" cy="24" r="16"/><circle cx="23" cy="91" r="16"/><circle cx="100" cy="91" r="16"/><path d="M52 38L31 77M70 38L92 77M40 91H84"/></g><text x="656" y="173" font-size="24" fill="#0F172A" font-weight="700" text-anchor="start">Another VNet</text><text x="656" y="205" font-size="22" fill="#475569" font-weight="500" text-anchor="start">Peering · nontransitive</text><path d="M444,308 L544,308" stroke="#0078D4" fill="none" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 7"/><g transform="translate(560 270) scale(0.5901639344262295)" fill="none" stroke="#6366F1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 109V32L61 9L108 32V109ZM14 32H108M29 48H43V62H29ZM53 48H68V62H53ZM79 48H93V62H79ZM29 76H43V90H29ZM79 76H93V90H79ZM53 85H68V109H53Z"/></g><text x="656" y="295" font-size="24" fill="#0F172A" font-weight="700" text-anchor="start">Your office</text><text x="656" y="327" font-size="22" fill="#475569" font-weight="500" text-anchor="start">VPN or ExpressRoute</text><path d="M444,430 L544,430" stroke="#0078D4" fill="none" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 7"/><g transform="translate(560 392) scale(0.5901639344262295)" fill="none" stroke="#6366F1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="61" cy="24" rx="43" ry="17"/><path d="M18 24V92C18 115 104 115 104 92V24M18 49C18 73 104 73 104 49M18 73C18 96 104 96 104 73"/></g><text x="656" y="417" font-size="24" fill="#0F172A" font-weight="700" text-anchor="start">Azure service</text><text x="656" y="449" font-size="22" fill="#475569" font-weight="500" text-anchor="start">Private endpoint + DNS</text><text x="480" y="511" font-size="22" fill="#475569" font-weight="500" text-anchor="middle">Dashed paths are conceptual; no gateway or endpoint is deployed.</text><text x="480" y="540" font-size="22" fill="#475569" font-weight="500" text-anchor="middle">Private connectivity does not replace authorization.</text></g></svg>